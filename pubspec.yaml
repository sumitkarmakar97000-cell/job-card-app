name: job_card_selection_app
description: Job Card Selection & Excel Download Android App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core, Auth & Database
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Excel (.xlsx) Read & Write
  excel: ^4.0.6
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  share_plus: ^10.0.2

  # UI & Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
