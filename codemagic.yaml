workflows:
  android-apk-workflow:
    name: Build Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create Android project and configure Firebase
        script: |
          flutter create . --org com.example --project-name job_card_selection_app
          cp google-services.json android/app/google-services.json
          python3 -c '
          import os, re
          q = chr(34)
          for path in ["android/settings.gradle.kts", "android/settings.gradle"]:
              if os.path.exists(path):
                  txt = open(path).read()
                  txt = re.sub(r"(id[\(\s]+[\"\x27]com\.android\.application[\"\x27]\)?[^\n]*apply false)", r"\1\n    id(" + q + "com.google.gms.google-services" + q + ") version " + q + "4.4.2" + q + " apply false", txt)
                  open(path, "w").write(txt)
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(path):
                  txt = open(path).read()
                  txt = re.sub(r"(id[\(\s]+[\"\x27]com\.android\.application[\"\x27]\)?)", r"\1\n    id(" + q + "com.google.gms.google-services" + q + ")", txt)
                  open(path, "w").write(txt)
          for root, dirs, files in os.walk("lib"):
              for f in files:
                  if f == "firestore_service.dart":
                      p = os.path.join(root, f)
                      t = open(p).read()
                      t = re.sub(r"onProgress\s*\([^)]*\)\s*;", "", t)
                      open(p, "w").write(t)
          '
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
