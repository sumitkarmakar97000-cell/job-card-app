workflows:
  android-apk-workflow:
    name: Build Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create Android project and configure Firebase
        script: |
          flutter create . --org com.example --project-name job_card_selection_app
          cp google-services.json android/app/google-services.json
          python3 -c '
          import os, re
          for path in ["android/settings.gradle.kts", "android/settings.gradle"]:
              if os.path.exists(path):
                  txt = open(path).read()
                  txt = re.sub(r"(id[\(\s]+[\"\x27]com\.android\.application[\"\x27]\)?[^\n]*apply false)", r"\1\n    id(\"com.google.gms.google-services\") version \"4.4.2\" apply false", txt)
                  open(path, "w").write(txt)
          for path in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(path):
                  txt = open(path).read()
                  txt = re.sub(r"(id[\(\s]+[\"\x27]com\.android\.application[\"\x27]\)?)", r"\1\n    id(\"com.google.gms.google-services\")", txt)
                  open(path, "w").write(txt)
          '
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
